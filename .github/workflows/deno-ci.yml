name: Deno v2 CI with Prisma

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://prisma:password@localhost:5432/test_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Copy .env.ci into place
        run: cp ./env/.env.ci .env

      - name: Append env vars
        run: |
          echo "DATABASE_URL=\"${{ env.DATABASE_URL }}\"" >> .env
          echo "JWT_SECRET=\"$(openssl rand -hex 32)\"" >> .env

      # prisma/generated is gitignored, but mod/db/mod.ts imports it, so deno ci
      # (which resolves the full module graph) requires the client to exist first.
      - name: Generate Prisma Client
        run: deno run -A npm:prisma generate

      - name: Install dependencies
        run: deno ci

      - name: Apply Database Migrations
        run: deno run -A --env-file .env npm:prisma migrate deploy

      - name: Seed Database
        run: deno run -A --env-file .env ./prisma/seed/index.ts

      - name: Check formatting
        run: deno fmt --check

      - name: Lint code
        run: deno lint

      - name: Run tests
        run: |
          deno run -A --env-file .env src/main.ts &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/localhost/8000) 2>/dev/null; then
              exec 3>&- 3<&-
              break
            fi
            sleep 1
          done
          deno test -A --env-file=.env src/
