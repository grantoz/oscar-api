name: Deno v2 CI with Prisma

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://prisma:password@localhost:5432/test_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install dependencies
        run: deno ci

      - name: Copy .env.ci into place
        run: cp ./env/.env.ci .env

      - name: Create Temporary Env File
        run: echo "DATABASE_URL=${{ env.DATABASE_URL }}" >> .env

      - name: Generate Prisma Client
        run: deno run -A npm:prisma generate

      - name: Apply Database Migrations
        run: deno run -A npm:prisma migrate deploy

      - name: Seed Database
        run: deno run -A --env-file .env ./prisma/seed/index.ts

      - name: Check formatting
        run: deno fmt --check

      - name: Lint code
        run: deno lint

      - name: Run tests
        run: deno test --allow-all
