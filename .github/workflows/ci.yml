name: Node CI with Prisma

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run oxlint
        uses: oxc-project/oxlint-action@v2

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://prisma:password@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create env files
        run: |
          cp ./env/.env.ci .env
          cp ./env/.env.ci .env.test
          for f in .env .env.test; do
            echo "DATABASE_URL=${{ env.DATABASE_URL }}" >> "$f"
            echo "REDIS_URL=${{ env.REDIS_URL }}" >> "$f"
            echo "JWT_SECRET=$(openssl rand -base64 64)" >> "$f"
          done
          echo "PORT=8001" >> .env.test

      # prisma/generated is gitignored, but mod/db/mod.ts imports it, so the
      # client must be generated before typechecking/starting the app.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Database Migrations
        run: npx prisma migrate deploy

      - name: Seed Database
        run: node --import tsx ./prisma/seed/index.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: |
          node --env-file=.env.test --import tsx src/main.ts &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/localhost/8001) 2>/dev/null; then
              exec 3>&- 3<&-
              break
            fi
            sleep 1
          done
          npm test
